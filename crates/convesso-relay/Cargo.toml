[package]
name = "convesso-relay"
version = "0.0.0"
description = "The convesso relay server: forwards opaque packets between authenticated keys. Sans-IO."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
convesso-core = { path = "../convesso-core", version = "0.0.0", features = ["alloc"] }

[dev-dependencies]
# Tests put arbitrary packets through the relay, with `through_relay`.
convesso-core = { path = "../convesso-core", version = "0.0.0", features = ["alloc", "ed25519-seed", "testing"] }
# Reliable messages in the simulated world.
convesso-stream = { path = "../convesso-stream", version = "0.0.0", features = ["alloc"] }
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

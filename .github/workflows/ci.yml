# The checks every change must pass (DESIGN.md §9). The scripts
# they call are the same ones a developer runs locally.
#
# A change reaches main through a pull request, and the checks run on it: on
# the branch merged with main as it is, which is what main becomes. A pull
# request merged while up to date puts on main exactly what was checked, so
# main is not checked again. A pull request that main has moved past is
# updated, and checked again.
#
# On a pull request, each job runs when the files it checks changed (the
# `changes` job below); the host checks always run. A file every job depends
# on (the lock file, the toolchain, the scripts, this workflow) runs them all.
# A full run also comes every week, for advisories published since and for
# what a path filter could miss, and can be started by hand, on main before a
# release for instance.
name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

# A newer push to a pull request makes its older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read the code, nothing more; the job that lists a pull request's files also
# reads the pull request.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # What the pull request changed; everything, for a run by hand or by
  # schedule.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.mode.outputs.full }}
      deps: ${{ steps.filter.outputs.deps == 'true' }}
      embedded: ${{ steps.filter.outputs.embedded == 'true' }}
      core: ${{ steps.filter.outputs.core == 'true' }}
      stream: ${{ steps.filter.outputs.stream == 'true' }}
      relay: ${{ steps.filter.outputs.relay == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - '.github/**'
              - 'scripts/**'
              - 'fuzz/**'
            deps:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'deny.toml'
            embedded:
              - 'crates/convesso-core/**'
              - 'crates/convesso-stream/**'
              - 'crates/convesso-embassy/**'
              - 'crates/convesso-vectors/**'
              - 'firmware/**'
              - 'footprint-budget.toml'
            core:
              - 'crates/convesso-core/**'
            stream:
              - 'crates/convesso-stream/**'
            relay:
              - 'crates/convesso-relay/**'
      - id: mode
        run: echo "full=${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' }}" >> "$GITHUB_OUTPUT"

  # Host: formatting, lints, tests and the dependency policy.
  checks:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: The repository explains itself (what the files cite)
        run: python3 scripts/check-public.py
      - name: Formatting
        run: |
          cargo fmt --all --check
          (cd firmware && cargo fmt --check)
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        # About 7 minutes: a test that hangs fails the job here, with its log,
        # rather than holding it for GitHub's six hours.
        timeout-minutes: 20
        run: cargo test --workspace --all-features
      - name: Dependency policy (advisories, minimum versions, licences, sources)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.deps == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # No secret in the tree, nor in the commits a pull request adds: gitleaks, at
  # a pinned image. A run by hand or by schedule walks the whole history.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The history the commit scan walks.
          fetch-depth: 0
      - name: The tree as it stands
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS" dir /repo --redact --no-banner
      # A secret added in one commit and removed in the next is gone from the
      # tree and still in the history.
      - name: The commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo --log-opts="$range" --redact --no-banner

  # Embedded targets: the core builds without an allocator, a core that needs
  # one is refused, the primitives reproduce their vectors under QEMU, and the
  # footprint stays within the committed budget. Only what the firmware links
  # can change any of it.
  embedded:
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.embedded == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain and its embedded targets
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            firmware -> target
      - name: Install QEMU
        # RISC-V is in qemu-system-misc up to Ubuntu 24.04, and in a package of
        # its own from 26.04.
        run: |
          sudo apt-get update
          riscv=qemu-system-misc
          if apt-cache show qemu-system-riscv >/dev/null 2>&1; then riscv=qemu-system-riscv; fi
          sudo apt-get install -y qemu-system-arm "$riscv"
      - name: Build the core, the embedded driver and the stream crate for the embedded targets
        run: |
          for target in thumbv7em-none-eabihf riscv32imc-unknown-none-elf; do
            cargo build -p convesso-core --target "$target"
            cargo build -p convesso-embassy --target "$target"
            cargo build -p convesso-embassy --features stream --target "$target"
            cargo build -p convesso-stream --target "$target"
          done
      - name: Build the firmware (reference, reference-embassy, reference-stream, vectors)
        run: |
          cd firmware
          for target in thumbv7em-none-eabihf riscv32imc-unknown-none-elf; do
            cargo build --release --target "$target"
            cargo build --release --target "$target" --features stream --bin reference-stream
          done
      - name: Clippy on the firmware
        run: |
          cd firmware
          for target in thumbv7em-none-eabihf riscv32imc-unknown-none-elf; do
            cargo clippy --release --target "$target" -- -D warnings
            cargo clippy --release --target "$target" --features stream --bin reference-stream -- -D warnings
          done
      - name: A core or a stream crate that needs an allocator is refused
        run: |
          sh scripts/check-no-alloc.sh thumbv7em-none-eabihf
          sh scripts/check-no-alloc.sh riscv32imc-unknown-none-elf
      - name: Official vectors under QEMU (Cortex-M4)
        run: sh scripts/run-vectors-qemu.sh thumbv7em-none-eabihf
      - name: Official vectors under QEMU (RISC-V RV32)
        run: sh scripts/run-vectors-qemu.sh riscv32imc-unknown-none-elf
      - name: Footprint within budget
        run: python3 scripts/footprint.py

  # Every decoder of network input, fuzzed for a bounded time: the targets of
  # the crates that changed. Sixteen of them fuzz the core, so a change to it
  # fuzzes them all.
  fuzz:
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.stream == 'true' || needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the nightly pinned for fuzzing
        run: cd fuzz && rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz the targets of what changed, 60 seconds each
        env:
          FULL: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' }}
          STREAM: ${{ needs.changes.outputs.stream }}
          RELAY: ${{ needs.changes.outputs.relay }}
        run: |
          if [ "$FULL" = true ]; then
            sh scripts/fuzz.sh 60
          else
            targets=""
            [ "$STREAM" = true ] && targets="$targets stream_channel stream_frame"
            [ "$RELAY" = true ] && targets="$targets relay_server"
            sh scripts/fuzz.sh 60 $targets
          fi

# Fuzz targets for every decoder of network input (DESIGN.md §9).
# A workspace of its own, on a nightly toolchain pinned in fuzz/rust-toolchain.toml:
# cargo-fuzz needs nightly, and nothing shipped is built with it.
#
#   sh scripts/fuzz.sh [seconds per target]
[workspace]

[package]
name = "convesso-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
convesso-core = { path = "../crates/convesso-core", features = ["testing"] }
convesso-relay = { path = "../crates/convesso-relay" }
convesso-stream = { path = "../crates/convesso-stream" }

[[bin]]
name = "classify"
path = "fuzz_targets/classify.rs"
test = false
doc = false
bench = false


# Dependency policy, checked with `cargo deny check advisories bans licenses sources`.
#
# The cryptographic-crate rule of DESIGN.md §3 says each crate is held at
# or above a minimum version that excludes its known advisories. `advisories`
# refuses any crate with a published advisory; `bans.deny` states the minimums
# explicitly, so a minimum survives even if an advisory were withdrawn.
#
# `licenses` keeps every crate in the tree under a licence that lets convesso
# ship under the AGPL-3.0-or-later.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "thumbv7em-none-eabihf",
    "riscv32imc-unknown-none-elf",
]
all-features = true

[advisories]
# Unmaintained crates are reported, not refused: an advisory with a fix is the
# thing that must block.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Licences compatible with shipping convesso under the AGPL-3.0-or-later, and
# nothing that is not in the tree: a licence nobody uses is not on this list.
# Most crates are dual-licensed, and one acceptable option is enough.
allow = [
    # smoltcp and managed, under the embedded driver.
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    # The dalek crates, subtle and if-addrs.
    "BSD-3-Clause",
    # ring (Apache-2.0 AND ISC), rustls and rustls-webpki: the feature `tls`.
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "curve25519-dalek", version = "<4.1.3", reason = "RUSTSEC-2024-0344: timing variability in scalar subtraction" },
    { name = "blake2", version = "<0.8.1", reason = "RUSTSEC-2019-0019: HMAC-BLAKE2 computed with the wrong block size" },
    { name = "ed25519-dalek", version = "<2.0.0", reason = "RUSTSEC-2022-0093: the double public key signing function oracle" },
    { name = "snow", version = "<0.9.5", reason = "RUSTSEC-2024-0011: unauthenticated payloads could advance the nonce" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
